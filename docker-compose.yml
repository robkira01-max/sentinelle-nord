services:

  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB:       sentinelle
      POSTGRES_USER:     sentinelle
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD requis}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sentinelle -d sentinelle"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  app:
    build: .
    restart: unless-stopped
    ports:
      - "${APP_PORT:-5000}:8000"
    env_file: .env
    environment:
      DATABASE_URL: postgresql://sentinelle:${POSTGRES_PASSWORD}@db:5432/sentinelle
      SCHEDULER_ENABLED: ${SCHEDULER_ENABLED:-true}
      FLASK_ENV: production
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
